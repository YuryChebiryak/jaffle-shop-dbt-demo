version: "3.9"

services:
  minio:
    image: minio/minio:latest
    container_name: jaffle-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  iceberg-rest:
    image: tabulario/iceberg-rest:latest
    container_name: jaffle-iceberg-rest
    environment:
      CATALOG_WAREHOUSE: s3://lakehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_ACCESS__KEY__ID: minioadmin
      CATALOG_S3_SECRET__ACCESS__KEY: minioadmin
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_REGION: us-east-1
    ports:
      - "8181:8181"
    depends_on:
      minio:
        condition: service_healthy

  superset:
    image: apache/superset:latest
    container_name: jaffle-superset
    environment:
      SUPERSET_LOAD_EXAMPLES: "no"
      SUPERSET_SECRET_KEY: "secret"
    volumes:
      - superset-home:/app/superset_home
      - ./init_superset.sh:/app/init_superset.sh
    ports:
      - "8088:8088"
    command: /app/init_superset.sh

  trino:
    image: trinodb/trino:latest
    container_name: trino
    ports:
      - "8080:8080"
    environment:
      - DISCOVERY_URI=http://trino:8080
    volumes:
      - ./trino/etc:/etc/trino
    depends_on:
      iceberg-rest:
        condition: service_started
      minio:
        condition: service_healthy

volumes:
  minio-data:
  superset-home:
